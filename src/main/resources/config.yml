#  Messages use MiniMessage: <#8A5CF6>, <gradient>, <bold>.
#  Placeholders: {0}, {1}...</titles>
#  Reload: /halloween reload
# ============================================================

settings:
  # Candy range per broken pumpkin.
  candies-min: 1
  candies-max: 3

  # Chance (percent) that a broken pumpkin drops Cursed Pumpkin.
  cursed-chance-percent: 8

  # Exchange rate: cursed pumpkin -> candies.
  cursed-exchange-cost: 25

  # Pumpkins respawned daily at the moment; also spawn in batches
  # each respawn-hours hours around world spawn ("city") and randomly ("wild").
  pumpkins-per-day: 120
  city-pumpkins-percent: 60
  city-radius: 300
  wild-radius: 2000

  # Boss: Headless Horseman appears every day at 20:00 MSK.
  boss:
    enabled: true
    time-zone: "Europe/Moscow"
    hour: 20
    minute: 0
    reward-candies: 25
    name: "Всадник без головы"
    health: 200.0

  # GUI shop title (in lang file: bossbar not used here).
sounds:
  reward-purchase: "entity.player.levelup"
  reward-fail: "entity.villager.no"
  pumpkin-break: "block.wood_break"
  boss-spawn: "entity.ender_dragon.growl"
